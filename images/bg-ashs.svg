<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 960" width="480" height="960">
  <defs>
    <filter id="neonBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <radialGradient id="haloWhite" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes bgBreatheA { 0%,100% { opacity:0.75; } 50% { opacity:1; } }
    @keyframes bgBreatheB { 0%,100% { opacity:1; } 50% { opacity:0.7; } }
    .neon-a { animation: bgBreatheA 7s ease-in-out infinite; }
    .neon-b { animation: bgBreatheB 8.5s ease-in-out infinite 1.2s; }
    .halo-breathe { animation: bgBreatheA 10s ease-in-out infinite 2s; }
  </style>

  <rect width="480" height="960" fill="#000000"/>

  <circle class="halo-breathe" cx="30" cy="50" r="180" fill="url(#haloWhite)"/>
  <circle cx="450" cy="140" r="180" fill="url(#haloWhite)"/>
  <circle class="halo-breathe" cx="60" cy="480" r="200" fill="url(#haloWhite)" style="animation-delay:4s;"/>
  <circle cx="430" cy="560" r="200" fill="url(#haloWhite)"/>
  <circle class="halo-breathe" cx="40" cy="860" r="180" fill="url(#haloWhite)" style="animation-delay:6s;"/>
  <circle cx="440" cy="920" r="180" fill="url(#haloWhite)"/>

  <g class="neon-a" fill="none" stroke-linecap="round" filter="url(#neonBlur)">
    <line x1="70" y1="140" x2="180" y2="205" stroke="#9B2FE0" stroke-opacity="0.4" stroke-width="2.2"/>
    <line x1="300" y1="460" x2="410" y2="525" stroke="#E8B84B" stroke-opacity="0.35" stroke-width="2.2"/>
    <line x1="40" y1="500" x2="140" y2="560" stroke="#E8B84B" stroke-opacity="0.35" stroke-width="2.2"/>
    <line x1="290" y1="770" x2="400" y2="835" stroke="#9B2FE0" stroke-opacity="0.4" stroke-width="2.2"/>
  </g>

  <g class="neon-b" fill="none" stroke-linecap="round">
    <line x1="70" y1="140" x2="180" y2="205" stroke="#c98cf0" stroke-opacity="0.7" stroke-width="1.4"/>
    <line x1="300" y1="460" x2="410" y2="525" stroke="#f6d998" stroke-opacity="0.6" stroke-width="1.4"/>
    <line x1="40" y1="500" x2="140" y2="560" stroke="#f6d998" stroke-opacity="0.6" stroke-width="1.4"/>
    <line x1="290" y1="770" x2="400" y2="835" stroke="#c98cf0" stroke-opacity="0.7" stroke-width="1.4"/>
  </g>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.8" stroke-linecap="round">
    <line x1="20" y1="20" x2="120" y2="80"/>
    <line x1="340" y1="10" x2="450" y2="65"/>
    <line x1="60" y1="230" x2="160" y2="285"/>
    <line x1="370" y1="330" x2="470" y2="385"/>
    <line x1="10" y1="700" x2="110" y2="755"/>
    <line x1="350" y1="640" x2="450" y2="695"/>
    <line x1="30" y1="880" x2="130" y2="935"/>
    <line x1="360" y1="900" x2="460" y2="955"/>
  </g>

  <g fill="#ffffff" fill-opacity="0.09" font-family="Arial, sans-serif" font-weight="800" font-size="46" letter-spacing="2">
    <text x="-30" y="120" transform="rotate(-12 -30 120)">ASHS</text>
    <text x="230" y="70" transform="rotate(-12 230 70)">ASHS</text>
    <text x="60" y="330" transform="rotate(-12 60 330)">ASHS</text>
    <text x="300" y="270" transform="rotate(-12 300 270)">ASHS</text>
    <text x="-20" y="600" transform="rotate(-12 -20 600)">ASHS</text>
    <text x="250" y="560" transform="rotate(-12 250 560)">ASHS</text>
    <text x="30" y="850" transform="rotate(-12 30 850)">ASHS</text>
    <text x="270" y="800" transform="rotate(-12 270 800)">ASHS</text>
    <text x="60" y="1050" transform="rotate(-12 60 1050)">ASHS</text>
    <text x="300" y="1010" transform="rotate(-12 300 1010)">ASHS</text>
  </g>

  <image href="logo-watermark.png" xlink:href="logo-watermark.png" x="90" y="417.5" width="300" height="300" opacity="0.5"/>
</svg>
